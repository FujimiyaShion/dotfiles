config_version = 13

[bar]
order = [ "waybar" ]

    [bar.waybar]
    background_opacity = 0.4999999888241291
    capsule_group = []
    concave_edge_corners = false
    end = [ "media", "tray", "cat", "network", "bluetooth", "volume", "battery", "session" ]
    margin_edge = 6
    scale = 1.1000000089406967
    start = [ "workspaces", "active_window" ]
    thickness = 20

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = false

    [desktop_widgets.widget]

[dock]
reserve_space = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.9499999787658453

[osd]
background_opacity = 0.9499999787658453

    [osd.kinds]
    keyboard_layout = false
    lock_keys = false
    media = false

[plugin_settings."dotnetrob/cat"]
panel_placement = "floating"

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
font_family = "Maple Mono NF CN"

    [shell.animation]
    enabled = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    wallpaper_placement = "floating"

    [shell.shadow]
    alpha = 0.089999997988343239

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

[wallpaper]
directory = "/home/shion/Pictures/Wallpapers"
edge_smoothness = 0.0
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/shion/Pictures/Wallpapers/wallhaven-p9y253.png"

    [wallpaper.last]
    path = "/home/shion/Pictures/Wallpapers/wallhaven-p9y253.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/shion/Pictures/Wallpapers/wallhaven-p9y253.png"

[widget.cat]
cat_size = 25
type = "dotnetrob/cat:cat"

[widget.clock]
format = "{:%m月%d日 %H:%M}"

[widget.workspaces]
active_pill_size = 2.0
label_source = "name"